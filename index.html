
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff4ed">
<title>For My Thepluuu 🪔</title>

<!-- Rounded Poppins typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #f17b9b;
  --deep-pink: #df527d;
  --cream: #fff8f0;
  --brown: #795347;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  background:
    radial-gradient(circle at 15% 15%, #ffe0e9 0, transparent 35%),
    radial-gradient(circle at 85% 85%, #ffe9c9 0, transparent 35%),
    linear-gradient(135deg, #fff8f2, #fff0f3);
  color: var(--brown);
  overflow-x: hidden;
}

.card {
  width: 100%;
  max-width: 470px;
  min-height: 570px;
  padding: 30px 22px;
  background: rgba(255,255,255,.9);
  border: 1px solid rgba(255,255,255,.9);
  border-radius: 30px;
  box-shadow: 0 18px 55px rgba(126,75,83,.13);
  text-align: center;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

h1 {
  color: #d95e83;
  font-size: 29px;
  line-height: 1.3;
  font-weight: 800;
  margin: 14px 0;
}

h2 {
  color: #d95e83;
  font-size: 24px;
  line-height: 1.4;
  font-weight: 700;
}

p {
  font-size: 16px;
  line-height: 1.8;
  font-weight: 400;
  margin: 14px 0;
}

.small {
  font-size: 13px;
  color: #a88b80;
}

.mascot {
  width: 150px;
  max-width: 55%;
  display: block;
  margin: 4px auto 15px;
}

.story-photo {
  width: min(340px, 90%);
  height: auto;
  max-height: 450px;
  object-fit: contain;
  border: 7px solid white;
  border-radius: 23px;
  box-shadow: 0 12px 35px rgba(100,60,40,.16);
  display: block;
  margin: 20px auto 16px;
}

.progress {
  width: 100%;
  height: 5px;
  border-radius: 20px;
  background: #f6e5e5;
  margin: 4px 0 24px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#f49ab2,#e76d91);
  border-radius: 20px;
  transition: width .3s ease;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  font-size: 15px;
  font-weight: 700;
  font-family: 'Poppins', sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.primary {
  color: white;
  background: linear-gradient(135deg,#f18eaa,#df5c83);
  box-shadow: 0 7px 18px rgba(223,92,131,.23);
}

.secondary {
  color: #d66c8a;
  background: #fff0f4;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px;
}

.question-buttons {
  min-height: 90px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 25px;
}

#noBtn {
  background: #f3eeee;
  color: #987e7e;
  position: relative;
}

#yesBtn {
  z-index: 2;
}

.ending {
  animation: popIn .65s ease both;
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(.88);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.hidden {
  display: none !important;
}

/* Floating music button */
#musicButton {
  position: fixed;
  right: 17px;
  bottom: 22px;
  z-index: 1000001;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 40px;
  padding: 12px 17px;
  color: white;
  background: linear-gradient(135deg,#f18eaa,#df5c83);
  box-shadow: 0 6px 22px rgba(170,70,110,.3);
  font-size: 14px;
  display: none;
}

#musicButton.visible {
  display: block;
}

/* Colourful falling paper confetti */
.confetti-piece {
  position: fixed;
  top: -24px;
  z-index: 999999;
  pointer-events: none;
  animation-name: paperFall;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
  will-change: transform, opacity;
}

@keyframes paperFall {
  0% {
    transform: translate3d(0,0,0) rotate(0deg);
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    transform: translate3d(0,110vh,0) rotate(760deg);
    opacity: 0;
  }
}

/* Fireworks */
.firework-particle {
  position: fixed;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  z-index: 999998;
  pointer-events: none;
  animation: burst 1.15s ease-out forwards;
}

@keyframes burst {
  0% {
    transform: translate(0,0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(var(--x),var(--y)) scale(.15);
    opacity: 0;
  }
}

@media (max-width: 380px) {
  .card {
    padding: 25px 16px;
    min-height: 540px;
  }

  h1 {
    font-size: 26px;
  }

  h2 {
    font-size: 22px;
  }

  p {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<main class="card" id="card">
  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div id="content"></div>
</main>

<!-- Background music -->
<audio id="backgroundMusic"
       src="haan-tu-hai.mp3.mp3"
       preload="auto"
       loop
       playsinline></audio>

<button id="musicButton" onclick="toggleMusic()">
  🎵 Music: ON
</button>

<!-- Teddy holding a glowing diya -->
<template id="teddy">
<svg class="mascot" viewBox="0 0 220 230"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Cute teddy holding a glowing diya">

  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#fff3a3"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9a17c"/>
      <stop offset="100%" stop-color="#b97c5d"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="100" r="86" fill="#ffd8e4" opacity=".75"/>

  <path d="M110 17 C87 -5 56 13 69 39 C80 58 110 70 110 70
           C110 70 140 58 151 39 C164 13 133 -5 110 17Z"
        fill="#f18da9"/>

  <circle cx="65" cy="75" r="27" fill="url(#bear)"/>
  <circle cx="155" cy="75" r="27" fill="url(#bear)"/>
  <circle cx="65" cy="75" r="13" fill="#f1c5aa"/>
  <circle cx="155" cy="75" r="13" fill="#f1c5aa"/>

  <ellipse cx="110" cy="118" rx="67" ry="67" fill="url(#bear)"/>
  <ellipse cx="110" cy="133" rx="40" ry="32" fill="#f4d7bf"/>

  <ellipse cx="87" cy="111" rx="5" ry="7" fill="#49352f"/>
  <ellipse cx="133" cy="111" rx="5" ry="7" fill="#49352f"/>
  <ellipse cx="110" cy="127" rx="7" ry="5" fill="#49352f"/>

  <path d="M110 132 Q100 144 91 135 M110 132 Q120 144 129 135"
        stroke="#49352f" stroke-width="3"
        fill="none" stroke-linecap="round"/>

  <ellipse cx="77" cy="128" rx="10" ry="6" fill="#f5a2a9" opacity=".7"/>
  <ellipse cx="143" cy="128" rx="10" ry="6" fill="#f5a2a9" opacity=".7"/>

  <ellipse cx="110" cy="192" rx="47" ry="29" fill="url(#bear)"/>

  <ellipse cx="78" cy="166" rx="18" ry="28"
           fill="#c58b69" transform="rotate(-32 78 166)"/>

  <ellipse cx="142" cy="166" rx="18" ry="28"
           fill="#c58b69" transform="rotate(32 142 166)"/>

  <circle cx="110" cy="171" r="34" fill="url(#glow)" opacity=".9"/>

  <path d="M76 184 Q110 164 144 184 L136 201 Q110 212 84 201Z"
        fill="#d98b39"/>

  <path d="M81 185 Q110 193 139 185"
        stroke="#ffdf87" stroke-width="3" fill="none"/>

  <path d="M110 177 Q96 162 110 146 Q124 162 110 177Z"
        fill="#ffae37"/>

  <path d="M110 173 Q103 163 110 155 Q117 163 110 173Z"
        fill="#fff5b0"/>
</svg>
</template>

<script>
const content = document.getElementById("content");
const progressFill = document.getElementById("progressFill");
const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");

const stories = [
  {
    image: "yukti-01.jpeg",
    text: "How does someone manage to look this breathtaking without even trying? You are honestly my favourite kind of distraction. 😮‍💨"
  },
  {
    image: "yukti-02.jpeg",
    text: "This smile deserves its own festival and I hope I get to be one of the reasons behind it always 👀"
  },
  {
    image: "yukti-03.jpeg",
    text: "If I could freeze one feeling in time it would be the feeling of being right next to you HONEY ❤️"
  },
  {
    image: "yukti-04.jpeg",
    text: "The diyas can compete for brightness all they want. We both know who is stealing the show. 🪔✨"
  },
  {
    image: "yukti-05.jpeg",
    text: "Those legs are making me forget all about the festivities !! Ahhhh I so badly want to lift them tonight but let's keep things auspicious for now. 😏🪔",
    extra: "Okay I will behave. For now. 🤭"
  },
  {
    image: "yukti-06.jpeg",
    text: "Pretty face dangerous charm absolutely and zero intention of letting me behave. You are divine babygirl 🫠"
  },
  {
    image: "yukti-07.jpeg",
    text: "My favourite person my favourite festival and hopefully many more Diwalis together. Here is to us. 💖"
  }
];

let current = -1;

function addTeddy() {
  const clone = document.getElementById("teddy").content.cloneNode(true);
  content.prepend(clone);
}

function updateProgress() {
  const total = stories.length + 2;
  const step = current + 1;
  progressFill.style.width = (step / total * 100) + "%";
}

function startMusic() {
  musicButton.classList.add("visible");

  music.play().then(() => {
    musicButton.textContent = "🎵 Music: ON";
  }).catch(() => {
    musicButton.textContent = "▶ Play music";
  });
}

function toggleMusic() {
  if (music.paused) {
    music.play().then(() => {
      musicButton.textContent = "🎵 Music: ON";
    }).catch(() => {
      musicButton.textContent = "▶ Play music";
    });
  } else {
    music.pause();
    musicButton.textContent = "🔇 Music: OFF";
  }
}

function showIntro() {
  current = -1;
  updateProgress();

  content.innerHTML = `
    <div class="ending">
      <h1>Heyyy, my Thepluuu! 🪔</h1>

      <p>
        I have a tiny little Diwali surprise for someone
        who makes my world a whole lot brighter.
      </p>

      <p>
        And obviously that someone is you my favourite human. ❤️
      </p>

      <p class="small">A little something made with lots of love.</p>

      <div class="buttons">
        <button class="primary" onclick="beginSurprise()">
          Open your surprise ✨
        </button>
      </div>
    </div>
  `;

  addTeddy();
}

function beginSurprise() {
  startMusic();
  nextStory();
}

function nextStory() {
  current++;

  if (current >= stories.length) {
    showQuestion();
    return;
  }

  const story = stories[current];
  updateProgress();

  content.innerHTML = `
    <div class="ending">
      <h2>A little something about you… 💗</h2>

      <img class="story-photo"
           src="${story.image}"
           alt="A beautiful picture of Yukti">

      <p>${story.text}</p>

      ${story.extra ? `<p>${story.extra}</p>` : ""}

      <div class="buttons">
        <button class="primary" onclick="nextStory()">
          ${current === stories.length - 1
            ? "One last thing… 💖"
            : "Next surprise →"}
        </button>
      </div>
    </div>
  `;
}

function showQuestion() {
  current = stories.length;
  updateProgress();

  content.innerHTML = `
    <div class="ending">
      <h1>One last question, baby… 💖</h1>

      <p>
        After all this cuteness you didn't think I'd let you
        go without asking something !! Did you?
      </p>

      <h2>Will you celebrate Diwali with me JAAN? 🪔</h2>

      <p class="small">
        Choose wisely. The NO button has trust issues. 🤭
      </p>

      <div class="question-buttons">
        <button class="primary" id="yesBtn" onclick="sayYes()">
          YESSS! 💗
        </button>

        <button id="noBtn" onclick="runAway()">NO 🙈</button>
      </div>
    </div>
  `;

  addTeddy();

  const noBtn = document.getElementById("noBtn");
  noBtn.addEventListener("mouseenter", runAway);
}

function runAway() {
  const noBtn = document.getElementById("noBtn");
  if (!noBtn) return;

  const maxX = Math.max(0, window.innerWidth - 120);
  const maxY = Math.max(0, window.innerHeight - 70);

  noBtn.style.position = "fixed";
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
  noBtn.style.zIndex = "1000000";
}

function sayYes() {
  progressFill.style.width = "100%";

  content.innerHTML = `
    <div class="ending">
      <h1>YASSSSS, MY THEPLUUU!!! 💖</h1>

      <p>
        I knew you would say yes baby girl! Here is to more laughter
        more hugs more kisses and countless beautiful Diwalis together. Bohot pyar karta hoon baby please rehna hamesha mere sath mere pass. There is a lot of dreams I have seen with you aur wo sab pure karne hai. BE MINE 💋.
      </p>

      <h2>I love you my favourite patakha. 🪔😉</h2>

      <p>
        Happy Diwali cookie! Forever my favourite celebration. ✨
      </p>

      <p class="small">
        P.S. You're stuck with me for many many Diwalis. 🤭
      </p>
    </div>
  `;

  addTeddy();

  document.getElementById("card").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

  grandCelebration();

  let count = 0;

  const celebrationInterval = setInterval(() => {
    grandCelebration();
    count++;

    if (count >= 4) {
      clearInterval(celebrationInterval);
    }
  }, 2500);
}

/* Colourful falling paper confetti */
function launchConfetti() {
  const colours = [
    "#ff4f87", "#ffd166", "#70d6ff",
    "#c77dff", "#80ed99", "#ff8fab",
    "#ff9f1c", "#ffffff", "#e76f9b", "#f6bd60"
  ];

  for (let i = 0; i < 180; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";

    piece.style.left = Math.random() * 100 + "vw";
    piece.style.width = (6 + Math.random() * 8) + "px";
    piece.style.height = (9 + Math.random() * 12) + "px";

    piece.style.backgroundColor =
      colours[Math.floor(Math.random() * colours.length)];

    piece.style.borderRadius =
      Math.random() > .5 ? "50%" : "2px";

    piece.style.animationDuration =
      (2.7 + Math.random() * 2.5) + "s";

    piece.style.animationDelay =
      (Math.random() * .9) + "s";

    document.body.appendChild(piece);

    piece.addEventListener("animationend", () => piece.remove());
  }
}

/* Firework particles */
function firework(x, y) {
  const colours = [
    "#ff4f87", "#ffd166", "#70d6ff",
    "#c77dff", "#ffffff", "#ff9f1c"
  ];

  for (let i = 0; i < 32; i++) {
    const particle = document.createElement("div");
    particle.className = "firework-particle";

    particle.style.left = x + "vw";
    particle.style.top = y + "vh";

    particle.style.backgroundColor =
      colours[Math.floor(Math.random() * colours.length)];

    const angle = (Math.PI * 2 * i) / 32;
    const distance = 45 + Math.random() * 100;

    particle.style.setProperty(
      "--x",
      Math.cos(angle) * distance + "px"
    );

    particle.style.setProperty(
      "--y",
      Math.sin(angle) * distance + "px"
    );

    document.body.appendChild(particle);

    particle.addEventListener("animationend", () => particle.remove());
  }
}

function grandCelebration() {
  launchConfetti();

  firework(20 + Math.random() * 15, 20 + Math.random() * 25);
  firework(65 + Math.random() * 15, 20 + Math.random() * 25);
  firework(40 + Math.random() * 20, 35 + Math.random() * 20);
}

showIntro();
</script>

</body>
</html>
